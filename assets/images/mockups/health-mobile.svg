<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <rect width="600" height="380" rx="12" fill="#0A101C" />
  <!-- Centered Mobile Frame -->
  <g transform="translate(190, 20)">
    <rect x="0" y="0" width="220" height="340" rx="30" fill="#121B2A" stroke="#263854" stroke-width="2.5" />
    <!-- Dynamic Island / Speaker -->
    <rect x="75" y="10" width="70" height="12" rx="6" fill="#000000" />
    <!-- Screen Header -->
    <text x="24" y="52" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Aura Health</text>
    <text x="24" y="66" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Biometric Forecasting</text>
    <circle cx="196" cy="56" r="10" fill="rgba(242,138,36,0.2)" />
    <circle cx="196" cy="56" r="4" fill="#F28A24" />
    <!-- Vital Stats Circle -->
    <circle cx="110" cy="135" r="50" fill="none" stroke="#1E2D48" stroke-width="8" />
    <circle cx="110" cy="135" r="50" fill="none" stroke="#F28A24" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="65" stroke-linecap="round" />
    <text x="110" y="132" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">94%</text>
    <text x="110" y="148" font-family="'Inter', sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">VITAL SCORE</text>
    <!-- Metric Cards -->
    <rect x="20" y="205" width="180" height="42" rx="8" fill="#17243A" stroke="#1E2D48" />
    <text x="32" y="224" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Resting Heart Rhythm</text>
    <text x="32" y="238" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">58 BPM • Optimal</text>
    <rect x="20" y="255" width="180" height="42" rx="8" fill="#17243A" stroke="#1E2D48" />
    <text x="32" y="274" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Sleep Recovery Index</text>
    <text x="32" y="288" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F28A24">8.4 hrs • Deep Stage</text>
    <!-- Home Bar -->
    <rect x="80" y="325" width="60" height="3" rx="1.5" fill="#64748B" />
  </g>
</svg>