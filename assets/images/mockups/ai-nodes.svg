<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <rect width="600" height="380" rx="12" fill="#0C1322" />
  <rect x="0.5" y="0.5" width="599" height="379" rx="11.5" stroke="#1E2D48" />
  <!-- AI Agent Pipeline Workflow -->
  <text x="30" y="45" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Synthetix Multi-Agent Dispatch Matrix</text>
  <text x="30" y="65" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Zero-touch autonomous operations & document parsing</text>
  
  <!-- Connecting Node Lines -->
  <line x1="120" y1="180" x2="280" y2="120" stroke="#F28A24" stroke-width="2" stroke-dasharray="4" />
  <line x1="120" y1="180" x2="280" y2="240" stroke="#F28A24" stroke-width="2" stroke-dasharray="4" />
  <line x1="280" y1="120" x2="470" y2="180" stroke="#F28A24" stroke-width="2" />
  <line x1="280" y1="240" x2="470" y2="180" stroke="#F28A24" stroke-width="2" />

  <!-- Node 1: Ingestion -->
  <rect x="50" y="145" width="140" height="70" rx="10" fill="#141E30" stroke="#F28A24" stroke-width="1.5" />
  <circle cx="70" cy="170" r="5" fill="#F28A24" />
  <text x="85" y="174" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Ingest Agent</text>
  <text x="70" y="196" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Inbound Webhooks</text>

  <!-- Node 2: Reasoning -->
  <rect x="220" y="85" width="150" height="70" rx="10" fill="#141E30" stroke="#263854" />
  <circle cx="240" cy="110" r="5" fill="#10B981" />
  <text x="255" y="114" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">LLM Analyzer</text>
  <text x="240" y="136" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Semantic Router</text>

  <!-- Node 3: Verification -->
  <rect x="220" y="205" width="150" height="70" rx="10" fill="#141E30" stroke="#263854" />
  <circle cx="240" cy="230" r="5" fill="#3B82F6" />
  <text x="255" y="234" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Policy Guard</text>
  <text x="240" y="256" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Human-in-Loop</text>

  <!-- Node 4: Action Dispatch -->
  <rect x="410" y="145" width="150" height="70" rx="10" fill="#17243A" stroke="#F28A24" stroke-width="1.5" />
  <circle cx="430" cy="170" r="5" fill="#F28A24" />
  <text x="445" y="174" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Action Executor</text>
  <text x="430" y="196" font-family="'Inter', sans-serif" font-size="9" fill="#10B981">Automated Resolution</text>
</svg>