<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="880" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2D48" />
      <stop offset="100%" stop-color="#0E1624" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28A24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F28A24" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F28A24" />
      <stop offset="100%" stop-color="#FFA84A" />
    </linearGradient>
    <filter id="cardShadow" x="-20" y="-10" width="920" height="590" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Main Floating Window Container -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="20" width="840" height="520" rx="16" fill="url(#bgGlow)" stroke="#263854" stroke-width="1.5" />
    
    <!-- Window Header Bar -->
    <rect x="20" y="20" width="840" height="46" rx="16" fill="#141E30" />
    <path d="M20 50 L860 50" stroke="#263854" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="48" cy="43" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="66" cy="43" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="84" cy="43" r="5" fill="#10B981" opacity="0.8" />
    
    <!-- Search / URL Bar -->
    <rect x="180" y="32" width="520" height="24" rx="6" fill="#0C131F" stroke="#263854" stroke-width="1" />
    <text x="210" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#6B7280">https://console.prospira.office/analytics/production</text>
    <circle cx="196" cy="44" r="3" fill="#F28A24" />
    
    <!-- Left Sidebar -->
    <rect x="20" y="66" width="180" height="474" fill="#10192A" />
    <line x1="200" y1="66" x2="200" y2="540" stroke="#1E2D48" stroke-width="1" />
    
    <!-- Sidebar Items -->
    <rect x="36" y="86" width="148" height="32" rx="6" fill="rgba(242, 138, 36, 0.15)" stroke="rgba(242, 138, 36, 0.3)" />
    <circle cx="52" cy="102" r="4" fill="#F28A24" />
    <text x="68" y="106" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Realtime Metrics</text>
    
    <rect x="36" y="126" width="148" height="30" rx="6" fill="transparent" />
    <circle cx="52" cy="141" r="3" fill="#64748B" />
    <text x="68" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Architecture Mesh</text>

    <rect x="36" y="162" width="148" height="30" rx="6" fill="transparent" />
    <circle cx="52" cy="177" r="3" fill="#64748B" />
    <text x="68" y="181" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Data Pipelines</text>

    <rect x="36" y="198" width="148" height="30" rx="6" fill="transparent" />
    <circle cx="52" cy="213" r="3" fill="#64748B" />
    <text x="68" y="217" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">API Gateways</text>
    
    <!-- Status Indicator at Bottom of Sidebar -->
    <rect x="36" y="476" width="148" height="44" rx="8" fill="#17243A" stroke="#263854" />
    <circle cx="54" cy="498" r="4" fill="#10B981" />
    <text x="66" y="495" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Network Active</text>
    <text x="66" y="508" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">99.98% Latency SLA</text>

    <!-- Main Content Area -->
    <!-- Top Stat Widgets -->
    <g transform="translate(220, 84)">
      <!-- Widget 1 -->
      <rect x="0" y="0" width="195" height="90" rx="10" fill="#141E30" stroke="#263854" />
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">PLATFORM THROUGHPUT</text>
      <text x="16" y="56" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">2.48M</text>
      <text x="16" y="74" font-family="'Inter', sans-serif" font-size="10" fill="#10B981">+28.4% this cycle</text>
      <circle cx="170" cy="28" r="8" fill="rgba(242,138,36,0.15)" />
      <path d="M166 30 L170 24 L174 30" stroke="#F28A24" stroke-width="1.5" fill="none" />

      <!-- Widget 2 -->
      <rect x="210" y="0" width="195" height="90" rx="10" fill="#141E30" stroke="#263854" />
      <text x="226" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">CONVERSION VELOCITY</text>
      <text x="226" y="56" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#F28A24">4.8x</text>
      <text x="226" y="74" font-family="'Inter', sans-serif" font-size="10" fill="#10B981">Accelerated delivery</text>

      <!-- Widget 3 -->
      <rect x="420" y="0" width="200" height="90" rx="10" fill="#141E30" stroke="#263854" />
      <text x="436" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.5">SYSTEM LATENCY</text>
      <text x="436" y="56" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">18ms</text>
      <text x="436" y="74" font-family="'Inter', sans-serif" font-size="10" fill="#10B981">Optimized edge routing</text>
    </g>

    <!-- Center Chart Card -->
    <g transform="translate(220, 190)">
      <rect x="0" y="0" width="405" height="330" rx="12" fill="#141E30" stroke="#263854" />
      <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Digital Performance Growth Model</text>
      <text x="20" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Autonomous scaling benchmark telemetry</text>
      
      <!-- Chart Area -->
      <g transform="translate(20, 70)">
        <!-- Horizontal Grid Lines -->
        <line x1="0" y1="40" x2="365" y2="40" stroke="#1E2D48" stroke-dasharray="4" />
        <line x1="0" y1="90" x2="365" y2="90" stroke="#1E2D48" stroke-dasharray="4" />
        <line x1="0" y1="140" x2="365" y2="140" stroke="#1E2D48" stroke-dasharray="4" />
        <line x1="0" y1="190" x2="365" y2="190" stroke="#1E2D48" stroke-dasharray="4" />
        
        <!-- Gradient Curve Fill -->
        <path d="M0 180 Q60 160 110 110 T220 70 T365 20 L365 210 L0 210 Z" fill="url(#chartGrad)" />
        
        <!-- Chart Line -->
        <path d="M0 180 Q60 160 110 110 T220 70 T365 20" stroke="#F28A24" stroke-width="3" fill="none" />
        
        <!-- Key Nodes -->
        <circle cx="110" cy="110" r="5" fill="#FFFFFF" stroke="#F28A24" stroke-width="2" />
        <circle cx="220" cy="70" r="5" fill="#FFFFFF" stroke="#F28A24" stroke-width="2" />
        <circle cx="365" cy="20" r="6" fill="#F28A24" stroke="#FFFFFF" stroke-width="2" />
        
        <!-- Value Callout -->
        <rect x="290" y="2" width="70" height="22" rx="4" fill="#F28A24" />
        <text x="325" y="16" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">+148% ROI</text>
      </g>
    </g>

    <!-- Right Side System Feed -->
    <g transform="translate(640, 190)">
      <rect x="0" y="0" width="200" height="330" rx="12" fill="#141E30" stroke="#263854" />
      <text x="18" y="32" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pipeline Health</text>
      
      <!-- Progress Bars -->
      <g transform="translate(18, 55)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Next.js Core SSR</text>
        <text x="164" y="10" font-family="'Inter', sans-serif" font-size="10" fill="#F28A24" text-anchor="end">99%</text>
        <rect x="0" y="18" width="164" height="6" rx="3" fill="#1E2D48" />
        <rect x="0" y="18" width="160" height="6" rx="3" fill="url(#barGrad)" />

        <text x="0" y="45" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Micro-Services Mesh</text>
        <text x="164" y="45" font-family="'Inter', sans-serif" font-size="10" fill="#F28A24" text-anchor="end">96%</text>
        <rect x="0" y="53" width="164" height="6" rx="3" fill="#1E2D48" />
        <rect x="0" y="53" width="154" height="6" rx="3" fill="url(#barGrad)" />

        <text x="0" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">AI Agent Engine</text>
        <text x="164" y="80" font-family="'Inter', sans-serif" font-size="10" fill="#F28A24" text-anchor="end">100%</text>
        <rect x="0" y="88" width="164" height="6" rx="3" fill="#1E2D48" />
        <rect x="0" y="88" width="164" height="6" rx="3" fill="url(#barGrad)" />

        <text x="0" y="115" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Mobile Synch State</text>
        <text x="164" y="115" font-family="'Inter', sans-serif" font-size="10" fill="#F28A24" text-anchor="end">94%</text>
        <rect x="0" y="123" width="164" height="6" rx="3" fill="#1E2D48" />
        <rect x="0" y="123" width="150" height="6" rx="3" fill="url(#barGrad)" />
      </g>

      <!-- Badge at bottom -->
      <rect x="18" y="240" width="164" height="65" rx="8" fill="#10192A" stroke="#263854" />
      <text x="30" y="262" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PROSPIRA ENGINE</text>
      <text x="30" y="278" font-family="'Inter', sans-serif" font-size="9" fill="#9CA3AF">Production Ready Build</text>
      <circle cx="160" cy="272" r="6" fill="#F28A24" />
    </g>
  </g>
</svg>