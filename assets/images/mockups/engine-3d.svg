  <text x="32" y="39" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#F28A24">CHRONOS 3D // 60 FPS</text>
  <rect x="490" y="20" width="90" height="30" rx="6" fill="#141E30" stroke="#1E2D48" />
  <text x="502" y="39" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">PBR Shaders</text>
  <!-- 3D Geometric Isometric Wireframe Cube & Sphere -->
